server:
  address: 127.0.0.1
  port: 8080

spring:
  # Core Properties
  application:
    name:
  main:
    allow-circular-references: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  threads:
    virtual:
      enabled: true
  # Data Properties
  data:
    redis:
      host: ''
      port: 6379
      password: ''
      database: 0
      timeout: 1000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
          min-idle: 0
  datasource:
    url: jdbc:mysql://?useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: ''
    password: ''
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 2000
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      phy-max-use-count: 1000
      async-init: true
  elasticsearch:
    uris: ''
    username: ''
    password: ''
  # Web Properties
  mvc:
    async:
      request-timeout: 3600000
  servlet:
    multipart:
      max-file-size: 99MB
      max-request-size: 99MB
  #
  cloud:
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr:
            namespace:
            username:
            password:
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        param-flow:
          nacos:
            server-addr:
            namespace:
            username:
            password:
            data-id: ${spring.application.name}-param-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: param-flow

mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.example.demo.*.dao.dataobject
  configuration:
    lazy-loading-enabled: true
    auto-mapping-unknown-column-behavior: WARNING
    default-statement-timeout: 3
    default-fetch-size: 100
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: ''
  producer:
    group: producer-group
  consumer:
    access-key: ''
    secret-key: ''

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
  registry:
    address:
    username:
    password:
    group: DUBBO_GROUP
    register: false
    register-mode: instance
  protocol:
    name: tri
    port: 50051
  consumer:
    check: false
    filter: -authenticationPrepare

xxl:
  job:
    admin:
      addresses:
      accessToken:
    executor:
      appname: ${spring.application.name}
      ip:
      port: 9999

